<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue iOS 26</title>
    <style>
        :root {
            --bg: #000000;
            --sidebar-bg: rgba(10, 10, 10, 0.98);
            --card-bg: rgba(28, 28, 30, 0.6);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-gray: #8e8e93;
            --blue-gradient: linear-gradient(135deg, #00d1ff 0%, #007aff 100%);
            --blur-strength: 30px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% -20%, #1c1c1e 0%, #000000 80%);
            z-index: -1;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 40px 25px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: 4px;
            background: var(--blue-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
            cursor: pointer;
        }

        .hamburger {
            cursor: pointer;
            z-index: 1001;
            width: 30px;
            height: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: flex-end;
        }

        .bar {
            height: 1px;
            background-color: var(--text-main);
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .bar-1 { width: 100%; }
        .bar-2 { width: 70%; }
        .bar-3 { width: 40%; }

        .hamburger.active .bar-1 { transform: translateY(8px) rotate(-45deg); width: 100%; }
        .hamburger.active .bar-2 { opacity: 0; }
        .hamburger.active .bar-3 { transform: translateY(-9px) rotate(45deg); width: 100%; }

        .sidebar {
            position: fixed;
            top: 0;
            right: -100%;
            width: 280px;
            height: 100vh;
            background: var(--sidebar-bg);
            backdrop-filter: blur(var(--blur-strength));
            transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
            padding: 120px 40px;
            display: flex;
            flex-direction: column;
            gap: 30px;
            border-left: 1px solid var(--card-border);
        }

        .sidebar.active { right: 0; }

        .sidebar a {
            color: var(--text-main);
            text-decoration: none;
            font-size: 1.4rem;
            opacity: 0.6;
            transition: 0.3s;
            cursor: pointer;
        }

        .sidebar a:hover { opacity: 1; color: #00d1ff; }

        .tab-content {
            display: none;
            padding: 0 25px;
            max-width: 500px;
            margin: 20px auto 40px;
            flex-direction: column;
            gap: 24px;
        }

        .tab-content.active {
            display: flex;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(var(--blur-strength));
            border-radius: 30px;
            padding: 30px;
            border: 1px solid var(--card-border);
        }

        /* Фиксированная высота для блока цитаты, чтобы контент не дергался */
        .quote-card {
            min-height: 140px; 
            display: flex;
            flex-direction: column;
        }

        #clock {
            font-size: 3.8rem;
            font-weight: 200;
            letter-spacing: -1px;
            line-height: 1;
            margin-bottom: 5px;
            font-variant-numeric: tabular-nums;
        }

        .label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--text-gray);
            margin-bottom: 15px;
            display: block;
        }

        .quote-container {
            display: flex;
            align-items: stretch;
            gap: 15px;
            flex-grow: 1;
        }

        .quote-line {
            width: 3px;
            background: var(--blue-gradient);
            border-radius: 2px;
            flex-shrink: 0;
        }

        .quote-text {
            font-size: 1.15rem;
            color: var(--text-main);
            line-height: 1.5;
            transition: opacity 0.4s ease;
        }

        .quote-fade {
            opacity: 0;
        }

        .affiliations-list {
            list-style: none;
        }

        .affiliations-list li {
            padding: 15px 0;
            color: var(--text-main);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            justify-content: space-between;
        }

        .affiliations-list li:last-child { border-bottom: none; }

        .content-text {
            font-size: 1.1rem;
            line-height: 1.6;
            color: var(--text-main);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .active .glass-card { animation: fadeIn 0.6s ease both; }
        .card-1 { animation-delay: 0.1s; }
        .card-2 { animation-delay: 0.2s; }
        .card-3 { animation-delay: 0.3s; }

    </style>
</head>
<body>
    <div class="bg-gradient"></div>

    <header>
        <div class="logo" onclick="showTab('home')">BLUE</div>
        <div class="hamburger" onclick="toggleMenu()">
            <div class="bar bar-1"></div>
            <div class="bar bar-2"></div>
            <div class="bar bar-3"></div>
        </div>
    </header>

    <div class="sidebar" id="sidebar">
        <div class="label">Навигация</div>
        <a onclick="showTab('home')">Home</a>
        <a onclick="showTab('affiliations')">Affiliations</a>
        <a onclick="showTab('about')">About</a>
    </div>

    <!-- Вкладка HOME -->
    <main id="home" class="tab-content active">
        <div class="glass-card card-1">
            <span class="label">Текущее время</span>
            <div id="clock">00:00:00</div>
            <div class="label" id="date-label">Дата</div>
        </div>

        <div class="glass-card card-2 quote-card">
            <span class="label">Рандомная цитата</span>
            <div class="quote-container">
                <div class="quote-line"></div>
                <div class="quote-text" id="quote">...</div>
            </div>
        </div>

        <div class="glass-card card-3">
            <span class="label">Проекты в которых я состою</span>
            <ul class="affiliations-list">
                <li>BDev <span>→</span></li>
                <li>Тринулия <span>→</span></li>
            </ul>
        </div>
    </main>

    <!-- Вкладка AFFILIATIONS -->
    <main id="affiliations" class="tab-content">
        <div class="glass-card card-1">
            <span class="label">Affiliations</span>
            <p class="content-text">Сюда впишешь что тебе надо</p>
        </div>
    </main>

    <!-- Вкладка ABOUT -->
    <main id="about" class="tab-content">
        <div class="glass-card card-1">
            <span class="label">About</span>
            <p class="content-text">Сюда впишешь что тебе надо</p>
        </div>
    </main>

    <script>
        const thoughts = [
            "Код работает? Не трогай.",
            "Лень — это энергосберегающий режим.",
            "Бирюзовый — цвет спокойствия.",
            "Минимализм — это не отсутствие чего-то, это идеальное количество.",
            "Blue — это стиль."
        ];

        let currentQuoteIndex = Math.floor(Math.random() * thoughts.length);

        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            
            const targetTab = document.getElementById(tabId);
            if (targetTab) {
                targetTab.classList.add('active');
            }

            const sidebar = document.getElementById('sidebar');
            if (sidebar.classList.contains('active')) {
                toggleMenu();
            }
        }

        function updateUI() {
            const now = new Date();
            const clockEl = document.getElementById('clock');
            const dateEl = document.getElementById('date-label');
            
            if (clockEl) {
                clockEl.innerText = now.toLocaleTimeString('ru-RU', {
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });
            }
            
            if (dateEl) {
                const options = { weekday: 'long', month: 'long', day: 'numeric' };
                dateEl.innerText = now.toLocaleDateString('ru-RU', options);
            }
        }

        function rotateQuote() {
            const quoteEl = document.getElementById('quote');
            if (!quoteEl) return;

            quoteEl.classList.add('quote-fade');

            setTimeout(() => {
                currentQuoteIndex = (currentQuoteIndex + 1) % thoughts.length;
                quoteEl.innerText = thoughts[currentQuoteIndex];
                quoteEl.classList.remove('quote-fade');
            }, 400);
        }

        function toggleMenu() {
            document.querySelector('.hamburger').classList.toggle('active');
            document.getElementById('sidebar').classList.toggle('active');
        }

        document.addEventListener('DOMContentLoaded', () => {
            const quoteEl = document.getElementById('quote');
            if (quoteEl) {
                quoteEl.innerText = thoughts[currentQuoteIndex];
            }
            
            updateUI();
            setInterval(updateUI, 1000);
            setInterval(rotateQuote, 5000);
        });
    </script>
</body>
</html>
